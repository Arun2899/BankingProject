<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Project</title>
    <style>
        /* General body styling */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 0;
        }

        /* Centering the content */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header styling */
        h1 {
            text-align: center;
            color: #4CAF50;
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        /* Styling for links */
        a {
            display: inline-block;
            margin: 10px 15px;
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 1.1em;
            transition: background-color 0.3s, transform 0.2s;
        }

        /* Link hover effect */
        a:hover {
            background-color: #0056b3;
            transform: scale(1.05);
        }

        /* Link focus effect */
        a:focus {
            outline: 3px solid #0056b3;
        }

    </style>
</head>
<body>

<div class="container">
    <h1>Bank Project</h1>
    <a href="/table">View</a>
    <a href="/add">Add</a>
</div>

</body>
</html>
