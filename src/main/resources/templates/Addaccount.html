<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account</title>
  <style>
    /* General body styling */
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f7f6;
        color: #333;
        margin: 0;
        padding: 0;
    }

    /* Centering the form on the page */
    .container {
        max-width: 600px;
        margin: 50px auto;
        padding: 20px;
        background-color: #ffffff;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    /* Styling the form elements */
    form {
        display: flex;
        flex-direction: column;
    }

    label {
        font-size: 1.1em;
        margin-bottom: 8px;
        color: #333;
    }

    input[type="text"] {
        padding: 10px;
        margin-bottom: 15px;
        font-size: 1em;
        border: 1px solid #ccc;
        border-radius: 4px;
        background-color: #f9f9f9;
        transition: border-color 0.3s ease;
    }

    /* Focus effect for input fields */
    input[type="text"]:focus {
        border-color: #4CAF50;
        outline: none;
        background-color: #e8f5e9;
    }

    /* Styling the submit button */
    button {
        padding: 12px;
        font-size: 1.2em;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.3s, transform 0.2s;
    }

    /* Hover effect for submit button */
    button:hover {
        background-color: #45a049;
        transform: scale(1.05);
    }

    /* Making the form responsive */
    @media (max-width: 600px) {
        .container {
            padding: 15px;
            margin: 20px;
        }

        label, input[type="text"], button {
            font-size: 1em;
        }
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Create Account</h2>
  <form th:object="${account}" th:action="@{/createaccount}" method="post">
    <label>Account Number</label>
    <input type="text" th:field="*{account_number}" required>

    <label>Enter the Name</label>
    <input type="text" th:field="*{account_holder_name}" required>

    <label>Enter the Aadhaar No</label>
    <input type="text" th:field="*{aadhar_no}" required>

    <label>Enter the Email</label>
    <input type="text" th:field="*{email}" required>

    <label>Enter the Contact Number</label>
    <input type="text" th:field="*{phone_no}" required>

    <label>Enter the Location</label>
    <input type="text" th:field="*{location}" required>

    <label>Enter the Balance</label>
    <input type="text" th:field="*{balance}" required>

    <button type="submit">Submit</button>
  </form>
</div>

</body>
</html>
